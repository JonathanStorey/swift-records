name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build and test
        run: swift test
      - name: Build for iOS
        run: |
          # Xcode names the package scheme differently across versions, so pick it from the list.
          SCHEMES=$(xcodebuild -list -json | python3 -c 'import json, sys; print("\n".join(json.load(sys.stdin)["workspace"]["schemes"]))')
          echo "Schemes: $SCHEMES"
          SCHEME=$(echo "$SCHEMES" | grep -x -m1 -e SwiftRecords -e swift-records-Package -e swift-records || echo "$SCHEMES" | head -1)
          xcodebuild build -scheme "$SCHEME" -destination 'generic/platform=iOS Simulator' -skipMacroValidation -quiet

  crate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Test the example app's models
        working-directory: Examples/Crate
        run: swift test
      - name: Build the example app for iOS and macOS
        working-directory: Examples/Crate/App
        run: |
          for destination in 'generic/platform=iOS Simulator' 'generic/platform=macOS'; do
            xcodebuild build -project Crate.xcodeproj -scheme Crate -destination "$destination" \
              -skipMacroValidation -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO -quiet
          done
      - name: Build the live test app
        run: |
          xcodebuild build -project LiveTests/SwiftRecordsLive.xcodeproj -scheme SwiftRecordsLive \
            -destination 'generic/platform=macOS' -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO -quiet

  linux:
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v5
      - name: Install SQLite
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Build and test
        run: swift test
      - name: Test the example app's models
        working-directory: Examples/Crate
        run: swift test
